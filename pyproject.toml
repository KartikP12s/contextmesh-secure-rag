[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "contextmesh-secure-rag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.34", "sqlalchemy>=2", "psycopg[binary]>=3.2", "pgvector>=0.4", "pydantic-settings>=2.7", "python-multipart>=0.0.20", "pypdf>=6", "python-docx>=1.1", "numpy>=2", "httpx>=0.28", "fastembed>=0.7"]
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11", "pip-audit>=2.9"]
[tool.setuptools.packages.find]
where = ["backend"]
[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
