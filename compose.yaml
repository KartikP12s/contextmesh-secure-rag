name: contextmesh
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: contextmesh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only}
      POSTGRES_DB: contextmesh
    ports: ["127.0.0.1:5440:5432"]
    volumes: ["database:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contextmesh"]
      interval: 3s
      retries: 20
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://contextmesh:${POSTGRES_PASSWORD:-local-only}@db:5432/contextmesh
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fastembed}
      ANSWER_PROVIDER: ${ANSWER_PROVIDER:-extractive}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes: ["models:/app/data"]
    ports: ["127.0.0.1:8010:8010"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health')"]
      interval: 5s
      retries: 20
  web:
    build: ./frontend
    ports: ["127.0.0.1:5174:8080"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  models:
  database:
